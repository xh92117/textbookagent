<div id="chatModal" class="modal-overlay" style="display:none;z-index:1000;">
    <div class="modal-content" style="width:900px;max-width:95vw;height:80vh;display:flex;flex-direction:column;padding:0;overflow:hidden;">
        <div style="padding:16px 20px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;">
            <div style="display:flex;align-items:center;gap:10px;">
                <div style="width:32px;height:32px;border-radius:8px;background:linear-gradient(135deg,#2563eb,#8b5cf6);display:flex;align-items:center;justify-content:center;color:white;font-size:14px;">💬</div>
                <div>
                    <div style="font-weight:700;font-size:14px;">AI 助手</div>
                    <div style="font-size:11px;color:var(--muted-fg);" id="chatModalSubtitle">与智能体对话</div>
                </div>
            </div>
            <button onclick="closeChatModal()" style="background:none;border:none;cursor:pointer;font-size:20px;color:var(--muted-fg);padding:4px 8px;">&times;</button>
        </div>
        <div id="chatModalMessages" style="flex:1;overflow-y:auto;padding:16px 20px;"></div>
        <div style="padding:12px 20px;border-top:1px solid var(--border);display:flex;gap:8px;">
            <input type="text" id="chatModalInput" placeholder="输入消息..." style="flex:1;padding:10px 14px;border:1px solid var(--border);border-radius:var(--radius-md);font-size:13px;font-family:var(--font-sans);background:var(--card);color:var(--fg);" onkeydown="if(event.key==='Enter')sendChatModalMessage()">
            <button class="btn-primary" onclick="sendChatModalMessage()" style="padding:10px 16px;">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="width:16px;height:16px"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
                发送
            </button>
        </div>
    </div>
</div>
